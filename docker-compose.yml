services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
    volumes:
      - cals-data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${CALS_HTTP_PORT:-8080}:80"

  # Tunnel Cloudflare Zero Trust (optionnel) : docker compose --profile tunnel up -d
  # Dans le dashboard Zero Trust, faire pointer le hostname public vers http://frontend:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend

volumes:
  cals-data:
