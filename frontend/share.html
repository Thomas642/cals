<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Suivi en direct — Family Tracker</title>
  <meta name="theme-color" content="#070c18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <script src="/vendor/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05080f; --surface: #0c1220; --surface2: #121a2e;
      --border: #1d2b42; --primary: #6366f1; --primary-l: #818cf8;
      --text: #e8edf5; --text-2: #b4c0d4; --text-muted: #627490;
      --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }
    #map { position: fixed; inset: 0; z-index: 0; }
    #infoCard {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0; padding: 1rem 1.25rem 1.5rem;
      box-shadow: 0 -8px 32px rgba(0,0,0,.5);
    }
    .handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto .75rem; }
    .card-header { display: flex; align-items: center; gap: .75rem; margin-bottom: .5rem; }
    .card-avatar {
      width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-weight: 700; font-size: 1rem; border: 2px solid var(--primary);
      overflow: hidden; flex-shrink: 0;
    }
    .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .card-name { font-size: 1.1rem; font-weight: 800; }
    .card-label { font-size: .78rem; color: var(--text-muted); }
    .card-meta { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: .5rem; font-size: .82rem; color: var(--text-2); }
    .card-meta span { display: flex; align-items: center; gap: .25rem; }
    .card-actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .btn { display: inline-flex; align-items: center; gap: .35rem; padding: .5rem 1rem; border-radius: 10px;
           font-family: var(--font); font-size: .84rem; font-weight: 600; border: none; cursor: pointer;
           text-decoration: none; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-full { flex: 1; justify-content: center; }
    .expired { text-align: center; padding: 3rem 1.5rem; }
    .expired h2 { font-size: 1.3rem; margin-bottom: .5rem; }
    .expired p { color: var(--text-muted); font-size: .88rem; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success);
                 animation: pulse 2s ease-in-out infinite; display: inline-block; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
    .member-marker { display: flex; flex-direction: column; align-items: center; }
    .marker-avatar {
      width: 44px; height: 44px; border-radius: 50%; border: 3px solid; background: #0c1220;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem;
      overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.6);
    }
    .marker-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .marker-name { font-size: .7rem; font-weight: 700; margin-top: 2px; text-shadow: 0 1px 4px rgba(0,0,0,.8); white-space: nowrap; }
    .marker-tail { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid; margin-top: -1px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="infoCard">
    <div class="handle"></div>
    <div id="cardContent">
      <p style="text-align:center;color:var(--text-muted);padding:1rem">Chargement…</p>
    </div>
  </div>

  <script>
    const map = L.map('map', { center: [46.5, 2.5], zoom: 6, zoomControl: false });
    L.control.zoom({ position: 'topleft' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://openstreetmap.org">OSM</a> © <a href="https://carto.com">CARTO</a>',
      maxZoom: 19, subdomains: 'abcd',
    }).addTo(map);

    const params = new URLSearchParams(location.search);
    const token  = params.get('t');
    let marker   = null;

    if (!token) {
      showExpired('Lien invalide', 'Ce lien de partage est invalide.');
    } else {
      fetchAndUpdate();
      setInterval(fetchAndUpdate, 15_000);
    }

    async function fetchAndUpdate() {
      try {
        const res  = await fetch(`/api/share/${encodeURIComponent(token)}`);
        if (!res.ok) { showExpired('Lien expiré', 'Ce lien de suivi a expiré ou est invalide.'); return; }
        const data = await res.json();
        renderCard(data);
        if (data.latitude && data.longitude) {
          const latlng = [data.latitude, data.longitude];
          if (!marker) {
            marker = L.marker(latlng, { icon: buildIcon(data), zIndexOffset: 1000 }).addTo(map);
            map.setView(latlng, 15, { animate: true });
          } else {
            marker.setLatLng(latlng);
            marker.setIcon(buildIcon(data));
          }
        }
      } catch {}
    }

    function buildIcon(d) {
      const color   = d.color || '#6366f1';
      const content = d.avatar_url ? `<img src="${d.avatar_url}" alt="">` : (d.name || '?').slice(0, 2).toUpperCase();
      return L.divIcon({
        html: `<div class="member-marker">
          <div class="marker-avatar" style="border-color:${color};color:${color}">${content}</div>
          <div class="marker-name" style="color:${color}">${d.name || ''}</div>
          <div class="marker-tail" style="border-top-color:${color}"></div>
        </div>`,
        className: '', iconSize: [60, 70], iconAnchor: [30, 70], popupAnchor: [0, -70],
      });
    }

    function renderCard(d) {
      const color   = d.color || '#6366f1';
      const ageText = d.recorded_at ? timeAgo(new Date(d.recorded_at)) : '—';
      const bat     = d.battery != null ? `🔋 ${d.battery}%` : '';
      const spd     = d.speed ? `⚡ ${Math.round(d.speed)} km/h` : '';
      const mapsUrl = d.latitude ? `https://www.google.com/maps/search/?api=1&query=${d.latitude},${d.longitude}` : '#';
      const wazeUrl = d.latitude ? `https://waze.com/ul?ll=${d.latitude},${d.longitude}&navigate=yes` : '#';

      const avatarHtml = d.avatar_url
        ? `<img src="${d.avatar_url}" alt="">`
        : (d.name || '?').slice(0, 2).toUpperCase();

      document.getElementById('cardContent').innerHTML = `
        <div class="card-header">
          <div class="card-avatar" style="border-color:${color};color:${color};background:${color}22">${avatarHtml}</div>
          <div>
            <div class="card-name">${escHtml(d.name || 'Inconnu')}</div>
            <div class="card-label">${escHtml(d.label || 'Suivi en direct')} &nbsp;<span class="pulse-dot"></span></div>
          </div>
        </div>
        <div class="card-meta">
          <span>🕐 Mis à jour ${ageText}</span>
          ${bat ? `<span>${bat}</span>` : ''}
          ${spd ? `<span>${spd}</span>` : ''}
        </div>
        <div class="card-actions">
          <a class="btn btn-primary btn-full" href="${mapsUrl}" target="_blank">Google Maps</a>
          <a class="btn btn-ghost btn-full" href="${wazeUrl}" target="_blank">Waze</a>
        </div>`;
    }

    function showExpired(title, msg) {
      document.getElementById('infoCard').innerHTML = `
        <div class="expired">
          <div style="font-size:2.5rem">🔒</div>
          <h2>${title}</h2>
          <p>${msg}</p>
        </div>`;
    }

    function timeAgo(date) {
      const secs = Math.floor((Date.now() - date) / 1000);
      if (secs < 60)   return `il y a ${secs}s`;
      if (secs < 3600) return `il y a ${Math.floor(secs / 60)}min`;
      if (secs < 86400) return `il y a ${Math.floor(secs / 3600)}h`;
      return `il y a ${Math.floor(secs / 86400)}j`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
