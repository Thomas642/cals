server {
  listen 80;
  root /usr/share/nginx/html;

  gzip            on;
  gzip_vary       on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types      text/plain text/css application/json application/javascript image/svg+xml;

  # Resolution DNS Docker a chaque requete : si le backend redemarre (nouvelle IP),
  # nginx le retrouve au lieu de renvoyer des 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Fichiers versionnes (nom avec empreinte) : cache long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html : toujours revalide, pour recuperer la derniere version apres une mise a jour.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA : toutes les routes front renvoient index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
