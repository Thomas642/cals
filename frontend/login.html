<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tracker — Connexion</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="theme-color" content="#070c18">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-body">

<div class="auth-card">
  <div class="auth-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
      <defs>
        <linearGradient id="ftAuthGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366f1"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
      </defs>
      <path d="M12 2C7.58 2 4 5.58 4 10c0 5.5 8 12 8 12s8-6.5 8-12c0-4.42-3.58-8-8-8z" fill="url(#ftAuthGrad)"/>
      <path d="M12 13.6l-2.85-2.7c-.78-.74-.78-1.94 0-2.68.74-.7 1.94-.7 2.68 0l.17.17.17-.17c.74-.7 1.94-.7 2.68 0 .78.74.78 1.94 0 2.68L12 13.6z" fill="#fff"/>
    </svg>
    <h1>Family Tracker</h1>
  </div>

  <!-- Login form -->
  <form id="loginForm" class="auth-form">
    <h2>Connexion</h2>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="vous@exemple.com">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="loginError" class="form-error hidden"></div>
    <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
    <p class="auth-switch">Pas encore de compte ? <a href="#" id="showRegister">Inscription par invitation</a></p>
  </form>

  <!-- Download app banner (hidden on native APK) -->
  <div id="downloadBanner" style="margin-top:1.2rem;text-align:center">
    <a href="/download.html" style="display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--primary-l,#60a5fa);text-decoration:none;opacity:.85">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zm7-18L5.33 8h3.84v5h5.66V8h3.84L12 2z"/></svg>
      Télécharger l'application Android
    </a>
  </div>

  <!-- Register form -->
  <form id="registerForm" class="auth-form hidden">
    <h2>Inscription</h2>
    <div class="form-group">
      <label for="inviteToken">Code d'invitation</label>
      <input type="text" id="inviteToken" required placeholder="Code reçu par l'admin">
    </div>
    <div class="form-group">
      <label for="regName">Prénom</label>
      <input type="text" id="regName" required placeholder="Votre prénom">
    </div>
    <div class="form-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" required placeholder="vous@exemple.com">
    </div>
    <div class="form-group">
      <label for="regPassword">Mot de passe</label>
      <input type="password" id="regPassword" required minlength="8" placeholder="8 caractères minimum">
    </div>
    <div id="registerError" class="form-error hidden"></div>
    <button type="submit" class="btn btn-primary btn-full">Créer mon compte</button>
    <p class="auth-switch">Déjà inscrit ? <a href="#" id="showLogin">Se connecter</a></p>
  </form>
</div>

<script>
  const _IS_NATIVE = !!(window.Capacitor?.isNativePlatform?.());
  const _API_BASE   = _IS_NATIVE ? 'https://famille.gameone-val.com' : '';
  const _HOME       = _IS_NATIVE ? '/index.html' : '/';
  if (_IS_NATIVE) {
    const b = document.getElementById('downloadBanner');
    if (b) b.style.display = 'none';
  }

  // Guest auto-login: ?auto_token=JWT → store and redirect immediately
  const autoToken = new URLSearchParams(location.search).get('auto_token');
  if (autoToken) {
    localStorage.setItem('ft_token', autoToken);
    location.href = _HOME;
  }

  // Pre-fill token from URL ?token=...
  const urlToken = new URLSearchParams(location.search).get('token');
  if (urlToken) {
    document.getElementById('inviteToken').value = urlToken;
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
  }

  document.getElementById('showRegister').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
  });

  document.getElementById('showLogin').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('registerForm').classList.add('hidden');
    document.getElementById('loginForm').classList.remove('hidden');
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('loginError');
    err.classList.add('hidden');
    try {
      const res = await fetch(_API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur de connexion');
      localStorage.setItem('ft_token', data.token);
      location.href = _HOME;
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove('hidden');
    }
  });

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('registerError');
    err.classList.add('hidden');
    try {
      const res = await fetch(_API_BASE + '/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: document.getElementById('inviteToken').value,
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur d'inscription");
      localStorage.setItem('ft_token', data.token);
      location.href = _HOME;
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
