<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Soft glow behind the pin -->
  <ellipse cx="256" cy="280" rx="120" ry="60" fill="#6366f1" opacity=".25" filter="url(#glow)"/>

  <!-- Pin teardrop -->
  <path d="M256 96
           C 162 96 96 162 96 256
           C 96 376 256 432 256 432
           C 256 432 416 376 416 256
           C 416 162 350 96 256 96 Z"
        fill="url(#pin)"/>

  <!-- White heart inside the pin -->
  <path d="M256 320
           L 200 266
           C 184 251 184 226 200 211
           C 215 196 240 196 255 211
           L 256 212
           L 257 211
           C 272 196 297 196 312 211
           C 328 226 328 251 312 266
           Z"
        fill="#fff"/>
</svg>
