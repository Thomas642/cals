# ════════════════════════════════════════════════════════════════════════════
#  FamilyTracker — Nginx configuration (Docker version)
#
#  - HTTP (80)  → redirige vers HTTPS
#  - HTTPS (443) → sert le frontend statique + proxy API/WebSocket
#
#  Les certificats Let's Encrypt sont montés en read-only depuis
#  /etc/letsencrypt sur l'hôte (renouvelés par le certbot système).
#  Après renouvellement, recharger le container :
#      docker compose exec nginx nginx -s reload
# ════════════════════════════════════════════════════════════════════════════

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name famille.gameone-val.com;

    # Allow ACME http-01 challenge (used by certbot --webroot if you ever switch)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name famille.gameone-val.com;

    # SSL — Let's Encrypt certs mounted from host
    ssl_certificate     /etc/letsencrypt/live/famille.gameone-val.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/famille.gameone-val.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options            DENY    always;
    add_header X-Content-Type-Options     nosniff always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Service-Worker-Allowed     "/";

    # Static frontend (mounted from ./frontend)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache for SW and manifest
    location ~ ^/(sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # JS/CSS: revalidation obligatoire
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Images / fonts: cache long terme
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads (volume Docker partagé avec l'API)
    location /uploads/ {
        alias /var/uploads/;
        expires 7d;
    }

    # /download/ exact → redirige vers la page de téléchargement stylée
    location = /download/ {
        return 301 /download.html;
    }
    location = /download {
        return 301 /download.html;
    }

    # APK + version.json : MIME types corrects, pas de cache
    location /download/ {
        location ~* \.apk$ {
            types { application/vnd.android.package-archive apk; }
            add_header Content-Disposition 'attachment; filename="FamilyTracker.apk"';
            add_header Cache-Control "no-store";
            expires -1;
        }
        location ~* \.json$ {
            types { application/json json; }
            add_header Cache-Control "no-store";
            expires -1;
        }
    }

    # API proxy → service Docker "api"
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket → service Docker "api"
    location /socket.io/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    client_max_body_size 10M;
}
