# Configuration HTTP uniquement — Certbot ajoutera le bloc SSL automatiquement
server {
    listen 80;
    listen [::]:80;
    server_name famille.gameone-val.com;

    # Security headers
    add_header X-Frame-Options            DENY    always;
    add_header X-Content-Type-Options     nosniff always;
    add_header Service-Worker-Allowed     "/";

    # Static frontend
    root /home/ubuntu/FamilyTracker/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache for SW and manifest
    location ~ ^/(sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads
    location /uploads/ {
        alias /home/ubuntu/FamilyTracker/uploads/;
        expires 7d;
    }

    # API proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    client_max_body_size 10M;
}
