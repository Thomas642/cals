# ════════════════════════════════════════════════════════════════════════════
#  FamilyTracker — Nginx configuration (host install, à déposer dans
#  /etc/nginx/sites-available/familytracker puis symlink dans sites-enabled).
#
#  Stack : Nginx système (sert plusieurs sites) + Docker compose (api + db).
#  Le backend tourne en Docker, exposé sur 127.0.0.1:3000.
#  Frontend statique servi depuis /home/ubuntu/FamilyTracker/frontend/.
#
#  Pour déployer une mise à jour de cette conf :
#    sudo cp nginx/familytracker.conf /etc/nginx/sites-available/familytracker
#    sudo nginx -t && sudo systemctl reload nginx
# ════════════════════════════════════════════════════════════════════════════

# HTTP → redirige vers HTTPS (Certbot peut ajouter sa propre redirection)
server {
    listen 80;
    listen [::]:80;
    server_name famille.gameone-val.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name famille.gameone-val.com;

    ssl_certificate     /etc/letsencrypt/live/famille.gameone-val.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/famille.gameone-val.com/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                                  # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                    # managed by Certbot

    # Security headers
    add_header X-Frame-Options            DENY    always;
    add_header X-Content-Type-Options     nosniff always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header Service-Worker-Allowed     "/";

    # Static frontend
    root /home/ubuntu/FamilyTracker/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache for SW and manifest
    location ~ ^/(sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # JS/CSS : revalidation obligatoire
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Images / fonts : cache long terme
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Uploads
    location /uploads/ {
        alias /home/ubuntu/FamilyTracker/uploads/;
        expires 7d;
    }

    # /download/ exact → page de téléchargement stylée (fix 403)
    location = /download/ {
        return 301 /download.html;
    }
    location = /download {
        return 301 /download.html;
    }

    # APK + version.json
    location /download/ {
        location ~* \.apk$ {
            types { application/vnd.android.package-archive apk; }
            add_header Content-Disposition 'attachment; filename="FamilyTracker.apk"';
            add_header Cache-Control "no-store";
            expires -1;
        }
        location ~* \.json$ {
            types { application/json json; }
            add_header Cache-Control "no-store";
            expires -1;
        }
    }

    # API proxy → container Docker exposé sur 127.0.0.1:3000
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    client_max_body_size 10M;
}
