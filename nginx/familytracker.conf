# Family Tracker — Nginx configuration
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Replace tracker.example.com with your actual domain

server {
    listen 80;
    server_name tracker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tracker.example.com;

    # ── SSL (managed by Certbot) ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            DENY                                  always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header Referrer-Policy            strict-origin-when-cross-origin       always;
    add_header Permissions-Policy         "geolocation=(self)"                  always;

    # Allow SW scope
    add_header Service-Worker-Allowed "/";

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/familytracker.access.log;
    error_log  /var/log/nginx/familytracker.error.log;

    # ── Static frontend ──────────────────────────────────────────────────────
    root /var/www/familytracker/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # No cache for SW and manifest
    location ~ ^/(sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Uploads
    location /uploads/ {
        alias /var/www/familytracker/uploads/;
        expires 7d;
    }

    # ── API proxy ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Rate limit at Nginx level
        limit_req zone=api burst=30 nodelay;
    }

    # ── WebSocket (Socket.io) ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ── Max upload size ──────────────────────────────────────────────────────
    client_max_body_size 10M;
}

# Rate limit zone (define in nginx.conf http block or here)
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
