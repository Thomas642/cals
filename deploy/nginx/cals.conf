# ════════════════════════════════════════════════════════════════════════════
#  Cals — nginx système (hôte) pour gameone-val.com
#
#  Installe par deploy/install.sh (MODE=nginx), ou a la main :
#    sudo cp deploy/nginx/cals.conf /etc/nginx/sites-available/cals
#    sudo ln -s /etc/nginx/sites-available/cals /etc/nginx/sites-enabled/cals
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d gameone-val.com -d www.gameone-val.com
#
#  Certbot ajoute lui-meme le bloc HTTPS (443) et la redirection.
#  __CALS_PORT__ est remplace par le port de CALS_HTTP_PORT (8080 par defaut).
# ════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name gameone-val.com www.gameone-val.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    # Application mono-utilisateur sans compte : acces protege par mot de passe.
    auth_basic           "Cals";
    auth_basic_user_file /etc/nginx/cals.htpasswd;

    add_header X-Frame-Options        DENY    always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        same-origin always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 2M;

    # Tout (front + /api) passe par le conteneur frontend de Cals.
    location / {
        proxy_pass         http://127.0.0.1:__CALS_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
